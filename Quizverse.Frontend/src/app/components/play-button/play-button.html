<button [ngClass]="[
    'group relative flex items-center overflow-hidden cursor-pointer',
    'h-20 w-93 lg:min-w-100 lg:max-w-110 lg:h-20',
    'transition-all duration-300 ease-out',
    'transform hover:scale-105 active:scale-95',
   customStyle ? customStyle : '',
  ]" [ngStyle]="{
    borderRadius: '1rem',
    background: 'linear-gradient(135deg, rgba(26, 35, 64, 0.85), rgba(17, 24, 39, 0.9))',
    backdropFilter: 'blur(16px)',
    border: '1px solid rgba(151, 206, 76, 0.25)',
    boxShadow: '0 0 15px rgba(151, 206, 76, 0.1), 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05)'
  }">

   <!-- Hover glow border effect -->
   <div class="absolute inset-0 rounded-2xl opacity-0 group-hover:opacity-100
           transition-opacity duration-300 pointer-events-none" [ngStyle]="{
      background: 'linear-gradient(135deg, rgba(151, 206, 76, 0.15), rgba(8, 186, 227, 0.15))',
      boxShadow: '0 0 25px rgba(151, 206, 76, 0.2), 0 0 50px rgba(8, 186, 227, 0.1)'
   }"></div>

   <!-- Top highlight -->
   <div class="absolute top-0 left-4 right-4 h-px bg-gradient-to-r from-transparent via-portal-green/30 to-transparent
           pointer-events-none"></div>

   @if(showIconCircle) {
   <div class="relative flex items-center justify-center
           w-14 h-14 rounded-xl ml-3
           transition-all duration-300
           group-hover:scale-110" [ngStyle]="{
      background: 'linear-gradient(135deg, rgba(151, 206, 76, 0.2), rgba(8, 186, 227, 0.2))',
      border: '1px solid rgba(151, 206, 76, 0.3)',
      boxShadow: '0 0 12px rgba(151, 206, 76, 0.15)'
   }">
      <div class="relative z-10 text-portal-green
             group-hover:text-portal-cyan
             transition-colors duration-300">
         <ng-content select="[icon]"></ng-content>
      </div>
   </div>
   }

   <div class="flex-1 px-6 py-3 text-left relative z-10">
      <div class="flex flex-col gap-0.5">
         <ng-content></ng-content>
      </div>
   </div>

   <!-- Right arrow indicator -->
   <div class="mr-4 text-portal-green/40 group-hover:text-portal-green/80
           group-hover:translate-x-1 transition-all duration-300 relative z-10">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
         <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
      </svg>
   </div>
</button>
