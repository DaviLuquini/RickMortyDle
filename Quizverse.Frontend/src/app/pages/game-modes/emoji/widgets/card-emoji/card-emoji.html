<div class="glass-card portal-glow p-5 sm:p-6 transition-all duration-300 w-full">
    <div class="flex flex-col items-center text-center justify-between 
    mb-4 gap-4 sm:gap-6 lg:w-128">
        <span class="schwifty text-3xl lg:text-4xl text-portal-cyan text-glow-cyan">Which character do these emojis describe?</span>
        <div class="flex flex-row items-center gap-8">
            <span class="text-3xl lg:text-5xl transition-all duration-300">{{ showEmoji(0, 0) }}</span>
            <span class="text-3xl lg:text-5xl transition-all duration-300">{{ showEmoji(1, 1) }}</span>
            <span class="text-3xl lg:text-5xl transition-all duration-300">{{ showEmoji(2, 2) }}</span>
        </div>
        <span class="text-white/30 text-xs font-medium tracking-wider uppercase">Each try unlocks an emoji</span>
    </div>
</div>
