<article class="ecard">
    <span class="ecard__tag wubbalubba">Which character do these emojis describe?</span>

    <div class="ecard__grid" role="group" aria-label="Emoji clues">
        @for (slot of [0, 1, 2]; track slot) {
            <div class="ecard__tile"
                 [class.is-unlocked]="tries >= slot"
                 [attr.aria-label]="tries >= slot ? 'emoji ' + (slot + 1) + ' revealed' : 'emoji ' + (slot + 1) + ' locked'">
                @if (tries >= slot) {
                    <span class="ecard__glyph">{{ showEmoji(slot, slot) }}</span>
                } @else {
                    <span class="ecard__glyph ecard__glyph--locked">?</span>
                }
            </div>
        }
    </div>

    <span class="ecard__hint">Each try unlocks an emoji.</span>
</article>
