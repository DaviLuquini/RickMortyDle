<div class="flex flex-col items-center justify-center rounded-xl p-3 w-full aspect-square 
    transition-all duration-300 hover:scale-105" [ngStyle]="{
    background: result.isCorrect ? 'rgba(34, 197, 94, 0.15)' : 'rgba(239, 68, 68, 0.1)',
    border: result.isCorrect ? '1px solid rgba(34, 197, 94, 0.4)' : '1px solid rgba(239, 68, 68, 0.3)',
    boxShadow: result.isCorrect ? '0 0 15px rgba(34, 197, 94, 0.2)' : '0 0 15px rgba(239, 68, 68, 0.1)'
  }">
    <img class="w-14 h-14 lg:w-18 lg:h-18 rounded-full shadow-md mb-2 object-cover" [ngStyle]="{
      border: result.isCorrect ? '2px solid rgba(34, 197, 94, 0.5)' : '2px solid rgba(255, 255, 255, 0.15)'
    }"
        [src]="result.character.image"
        alt="Rick and Morty Character" />
    <span class="font-bold text-center text-xs lg:text-sm leading-tight px-1" [ngStyle]="{
      color: result.isCorrect ? 'rgba(134, 239, 172, 1)' : 'rgba(255, 255, 255, 0.7)'
    }">
        {{ result.character.name }}
    </span>
</div>
