<div class="grid grid-cols-2 gap-3 sm:gap-4 mb-8 lg:w-140">
    <!-- First Letter Card -->
    <button type="button"
            class="hint-card group"
            [class.is-locked]="letterHintAttempts > 0"
            [class.is-revealed]="letterHintClicked()"
            (click)="onLetterHintClick()">
        <div class="hint-card__head">
            <span class="hint-card__icon">
                <lucide-icon class="w-5 h-5 sm:w-6 sm:h-6" [img]="Lightbulb"></lucide-icon>
            </span>
            <div class="hint-card__meta">
                <h3 class="hint-card__title">First Letter</h3>
                <p class="hint-card__sub">
                    @if (letterHintAttempts > 0) {
                        <span class="hint-card__lock-dot"></span>
                        Unlocks in {{ letterHintAttempts }}
                    } @else if (!letterHintClicked()) {
                        Click to reveal
                    } @else {
                        Revealed
                    }
                </p>
            </div>
            <div class="hint-card__chip" [class.hint-card__chip--reveal]="letterHintClicked()">
                @if (letterHintClicked()) {
                    <span class="wubbalubba hint-card__value">{{ showLetterHint }}</span>
                } @else {
                    <span>?</span>
                }
            </div>
        </div>
    </button>

    <!-- Image Card -->
    <button type="button"
            class="hint-card group"
            [class.is-locked]="imageHintAttempts > 0"
            [class.is-revealed]="imageHintClicked()"
            (click)="onImageHintClick()">
        <div class="hint-card__head">
            <span class="hint-card__icon">
                <lucide-icon class="w-5 h-5 sm:w-6 sm:h-6" [img]="Image"></lucide-icon>
            </span>
            <div class="hint-card__meta">
                <h3 class="hint-card__title">Visual Hint</h3>
                <p class="hint-card__sub">
                    @if (imageHintAttempts > 0) {
                        <span class="hint-card__lock-dot"></span>
                        Unlocks in {{ imageHintAttempts }}
                    } @else if (!imageHintClicked()) {
                        Click to reveal
                    } @else {
                        Revealed
                    }
                </p>
            </div>
            @if (imageHintAttempts == 0 && imageHintClicked()) {
                <div class="hint-card__chip hint-card__chip--reveal hint-card__chip--image">
                    <img class="hint-card__img" [src]="showImageHint" alt="Character hint" />
                </div>
            } @else {
                <div class="hint-card__chip">
                    <span>?</span>
                </div>
            }
        </div>
    </button>
</div>
