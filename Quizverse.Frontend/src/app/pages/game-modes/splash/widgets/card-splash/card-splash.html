<article class="scard">
    <span class="scard__tag wubbalubba">Which character is in the image?</span>

    <div class="scard__frame">
        <img class="scard__img"
             [style.opacity]="imageLoaded ? 1 : 0"
             [style.transform]="zoomScale"
             [src]="correctCharacter?.splash"
             alt="Character Splash Art"
             (load)="onImageLoad()" />
        <div class="scard__scanlines" aria-hidden="true"></div>
        <div class="scard__vignette" aria-hidden="true"></div>
        <span class="scard__try-chip" aria-label="Number of tries">TRY {{ tries }}</span>
    </div>

    <span class="scard__hint">Each try zooms out a bit.</span>
</article>
