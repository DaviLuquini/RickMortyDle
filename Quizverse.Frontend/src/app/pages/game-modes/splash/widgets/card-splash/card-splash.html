<div class="glass-card portal-glow p-5 sm:p-6 transition-all duration-300 w-full">
    <div class="flex flex-col items-center text-center justify-between mb-4 gap-4 sm:gap-5 lg:w-128">
        <span class="schwifty text-3xl lg:text-4xl text-portal-cyan text-glow-cyan">Which character is in the image?</span>

        <div class="relative w-56 h-56 lg:w-64 lg:h-64 overflow-hidden rounded-xl" [ngStyle]="{
          border: '2px solid rgba(8, 186, 227, 0.3)',
          boxShadow: '0 0 20px rgba(8, 186, 227, 0.15), 0 4px 20px rgba(0, 0, 0, 0.3)'
        }">
            <img class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 ease-out"
                [style.transform]="zoomScale" [src]="correctCharacter.splash" alt="Character Splash Art" />
        </div>
    </div>
</div>
